<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guoran Clock</title><style>/*__CSS__*/</style></head>
<body>
<aside class="sidebar wood">
  <a class="brand" href="#home"><span class="brand-mark">g</span><div>Guoran<small>CLOCK</small></div></a>
  <nav>
    <button class="nav active" data-page="home"><span data-icon="sun"></span><span data-i18n="home"></span></button>
    <button class="nav" data-page="time"><span data-icon="clock"></span><span data-i18n="time"></span></button>
    <button class="nav" data-page="settings"><span data-icon="sliders"></span><span data-i18n="settings"></span></button>
    <button class="nav" data-page="guide"><span data-icon="book"></span><span data-i18n="guide"></span></button>
    <button class="nav" data-page="journal"><span data-icon="terminal"></span><span data-i18n="journal"></span></button>
  </nav>
  <div class="sidebar-bottom"><div class="model">IN–12 · BLUETOOTH LE</div><div class="language-row"><span data-icon="globe"></span><select id="language" data-i18n-aria="language"><option value="ru">Russian</option><option value="en">English</option></select></div><button id="theme-toggle" class="nav"></button><small>Guoran Clock · 2.4.0</small></div>
</aside>
<main>
<header><div><div class="eyebrow" data-i18n="subtitle"></div><h1 id="page-title"></h1></div><button id="connection-button" class="connection"><i id="connection-dot"></i><span id="connection-label"></span><span data-icon="bluetooth"></span></button></header>
<div class="statusbar"><span data-icon="info"></span><span id="status"></span><button id="refresh" data-device class="text-button"><span data-icon="refresh"></span><span data-i18n="read"></span></button></div>
<section id="page-home" class="page active">
  <div class="hero"><div class="hero-copy"><span class="tag">IN12_M4</span><h2 data-i18n="device"></h2><p data-i18n="model"></p></div><div class="hero-image"><img src="__CLOCK_ICON__" alt="IN12_M4"></div></div>
  <div class="grid home-grid">
    <article class="card color-card"><div class="card-heading"><h2 data-i18n="color"></h2><span class="icon-circle" data-icon="palette"></span></div><p class="muted" data-i18n="colorHelp"></p><div class="color-readout"><span id="color-chip"></span><div><strong id="color-hex"></strong><small id="color-origin"></small></div><label class="color-picker" data-i18n-title="customColor"><span data-icon="palette"></span><input id="custom-color" type="color" value="#ff9500" data-device data-i18n-aria="customColor"></label></div><input id="hue" class="rainbow" type="range" min="0" max="360" value="30" data-device data-i18n-aria="hue"><div id="presets" class="presets"></div><div class="color-actions"><span id="draft-label"></span><button class="primary" id="apply-color" data-device data-i18n="applyColor"></button></div><div class="divider"></div><div class="row"><strong data-i18n="colorMode"></strong><div class="segmented"><button data-key="K01" data-device data-i18n-aria="previous">◀</button><button data-key="K02" data-device>M</button><button data-key="K03" data-device data-i18n-aria="next">▶</button></div></div></article>
    <article class="card remote-card"><div class="card-heading"><h2 data-i18n="remote"></h2><span class="icon-circle" data-icon="remote"></span></div><p class="muted" data-i18n="remoteHelp"></p><div class="remote-grid"><button class="power" data-key="K04" data-device><span data-icon="power"></span><small data-i18n="power"></small></button><button data-key="K05" data-device><span data-icon="back"></span><small data-i18n="back"></small></button><button data-key="K06" data-device><b>+</b><small data-i18n="plus"></small></button><button data-key="K07" data-device><b>SET</b><small data-i18n="setup"></small></button><button data-key="K08" data-device><b>OK</b><small data-i18n="confirm"></small></button><button data-key="K09" data-device><b>−</b><small data-i18n="minus"></small></button></div><p class="footnote" data-i18n="remoteNote"></p><button class="text-button" data-open-menu data-i18n="menuOpen" aria-controls="remote-reference" aria-expanded="false"></button><p class="footnote" data-i18n="menuPrepare"></p></article>
<article class="card menu-reference" id="remote-reference" hidden><div class="row"><h2 data-i18n="menuTable"></h2><button class="text-button" id="close-menu-reference" data-i18n="menuClose"></button></div><p class="footnote" data-i18n="menuReferenceOnly"></p><div class="table-wrap"><table><thead><tr><th data-i18n="code"></th><th data-i18n="function"></th><th data-i18n="values"></th></tr></thead><tbody id="remote-menu-table"></tbody></table></div></article>
    <article class="card channels-card"><h2 data-i18n="channels"></h2><div id="channels" class="channels"></div><p class="footnote" data-i18n="channelsNote"></p></article>
  </div>
</section>
<section id="page-time" class="page">
  <article class="card time-hero wood"><div><span class="tag" data-i18n="pcTime"></span><div id="computer-time">--:--:--</div><div id="computer-date"></div></div><div><button id="sync-once" class="primary" data-device><span data-icon="refresh"></span><span data-i18n="sync"></span></button><p data-i18n="syncHelp"></p></div></article>
  <div class="grid two-col"><article class="card"><h2 data-i18n="alarms"></h2><p class="muted" data-i18n="alarmsHelp"></p><div id="alarm-rows"></div></article>
    <article class="card"><div class="card-heading"><h2 data-i18n="schedule"></h2><button id="schedule-toggle" class="toggle unknown" role="switch" aria-checked="false" data-device data-i18n-aria="schedule"><i></i></button></div><p class="muted" data-i18n="scheduleHelp"></p><div class="schedule-fields"><label><span data-i18n="onTime"></span><input type="time" id="schedule-on" data-i18n-aria="onTime"></label><label><span data-i18n="offTime"></span><input type="time" id="schedule-off" data-i18n-aria="offTime"></label></div><p class="footnote" data-i18n="scheduleNote"></p><p id="schedule-local" class="setting-state"></p><p id="schedule-state" class="time-warning"></p><button id="schedule-apply" class="secondary" data-device data-i18n="scheduleApply"></button></article>
    <article class="card full"><div class="row"><div><h2 data-i18n="autoSync"></h2><p class="muted" data-i18n="autoSyncHelp"></p></div><button id="auto-sync" class="toggle" role="switch" aria-checked="false" data-device data-i18n-aria="autoSync"><i></i></button></div><p class="footnote" data-i18n="autoSyncNote"></p></article>
  </div>
</section>
<section id="page-settings" class="page"><div class="section-intro"><span id="read-time" class="badge"></span></div><div id="settings-grid" class="grid two-col"></div><article class="card protection-card"><div><h2 data-i18n="protection"></h2><p data-i18n="protectionShort"></p></div><button id="protection-help" class="secondary" data-i18n="how"></button></article></section>
<section id="page-guide" class="page"><p class="guide-lead" data-i18n="guideIntro"></p><article class="card guide-item"><h2 data-i18n="quickStart"></h2><p data-i18n="quickStartText"></p></article><article class="card guide-item" id="guide-protection"><h2>16 · <span data-i18n="protection"></span></h2><p data-i18n="guideProtection"></p></article><article class="card guide-item"><h2 data-i18n="guideMenu"></h2><p data-i18n="guideMenuText"></p><div class="menu-steps"><p data-i18n="menuStep1"></p><p data-i18n="menuStep2"></p><p data-i18n="menuStep3"></p></div><figure class="menu-diagram"><figcaption data-i18n="diagramTitle"></figcaption><div class="diagram-stages"><div><strong data-i18n="diagramItem"></strong><div class="tube-example"><span class="active-pair">02</span><b>:</b><span>—</span></div></div><div><strong data-i18n="diagramValue"></strong><div class="tube-example"><span>02</span><b>:</b><span class="active-pair">0</span></div></div></div><p data-i18n="diagramCaption"></p></figure><p data-i18n="menuExample"></p><p data-i18n="menuPrepare"></p><button class="text-button" data-open-menu data-i18n="menuOpen" aria-controls="remote-reference" aria-expanded="false"></button></article><article class="card guide-item"><h2 data-i18n="guideTouch"></h2><p data-i18n="guideTouchText"></p></article><article class="card guide-item"><h2 data-i18n="menuTable"></h2><div class="table-wrap"><table><thead><tr><th data-i18n="code"></th><th data-i18n="function"></th><th data-i18n="values"></th></tr></thead><tbody id="menu-table"></tbody></table></div></article><article class="card guide-item"><h2 data-i18n="guideRead"></h2><p data-i18n="guideReadText"></p></article><article class="card guide-item"><h2 data-i18n="guidePower"></h2><p data-i18n="guidePowerText"></p></article></section>
<section id="page-journal" class="page"><article class="card"><div class="card-heading"><h2 data-i18n="journal"></h2><button id="save-log" class="secondary"><span data-icon="download"></span><span data-i18n="saveLog"></span></button></div><p class="muted" data-i18n="logHelp"></p><pre id="journal"></pre></article></section>
<footer><span id="device-name"></span><span id="snapshot-state"></span></footer>
</main>
<dialog id="connect-dialog"><div class="dialog-head"><h2 data-i18n="connect"></h2><button class="icon-button" id="close-dialog" data-i18n-aria="close">×</button></div><p class="connection-hint" data-i18n="connectHelp"></p><p class="muted" data-i18n="connectNote"></p><div class="connection-actions"><button id="scan" class="primary"><span data-icon="search"></span><span data-i18n="scan"></span></button><button id="enable-bt" class="secondary" data-i18n="enableBt"></button></div><div id="device-list" class="device-list"></div><label class="field-label" for="password" data-i18n="password"></label><div class="password-row"><input id="password" type="password" inputmode="numeric" maxlength="6" value="210709" data-i18n-aria="password"><small data-i18n="passwordHint"></small></div><div class="dialog-foot"><button id="disconnect" class="secondary" data-i18n="disconnect"></button><button id="connect" class="primary" disabled data-i18n="connectAction"></button></div><p id="dialog-status" class="footnote"></p></dialog>
<div id="toast" role="status"></div><script>/*__JS__*/</script>
</body></html>
